<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF4DE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15130F" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="مصروفي">
<title>مصروفي</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF4DE; --card:#FFFFFF; --soft:#F7E9CC; --ink:#111111; --mute:#5B544A; --line:#111111; --sh:#111111;
  --orange:#FF5B2E; --yellow:#FFC93C; --blue:#2F5BFF; --green:#0B8A4A; --mint:#B8F2C9; --pinky:#FFD0DC; --red:#D93A12;
  --on-blue:#FFFFFF; --on-orange:#FFFFFF;
  --bw:2.5px; --r:20px;
  --amber:var(--yellow); --coral:var(--blue); --violet:var(--blue); --amber-soft:var(--soft); --coral-soft:var(--soft); --mint-soft:var(--soft); --violet-soft:var(--soft);
  --disp:"Baloo Bhaijaan 2","Readex Pro",Tahoma,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#15130F; --card:#221F19; --soft:#2C2820; --ink:#FFF4DE; --mute:#B9B09E; --line:#FFF4DE; --sh:#FFF4DE;
  --mint:#1F5A3A; --pinky:#5A2330; --green:#5BE39A;
}
@media (prefers-color-scheme: dark){
  :root[data-theme="auto"]{
    --bg:#15130F; --card:#221F19; --soft:#2C2820; --ink:#FFF4DE; --mute:#B9B09E; --line:#FFF4DE; --sh:#FFF4DE;
    --mint:#1F5A3A; --pinky:#5A2330; --green:#5BE39A;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:"Readex Pro",Tahoma,"Noto Sans Arabic",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
.num{direction:ltr;unicode-bidi:isolate;font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding:14px 16px 140px}
.pop{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--sh)}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0}
.brand{font-family:var(--disp);font-weight:800;font-size:1.6rem;line-height:1;white-space:nowrap}
.top-r{display:flex;align-items:center;gap:8px}
.month{display:flex;align-items:center;gap:2px;background:var(--card);border:var(--bw) solid var(--line);border-radius:999px;padding:3px;box-shadow:3px 3px 0 var(--sh)}
.month h1{font-size:.78rem;font-weight:700;margin:0;min-width:108px;text-align:center;white-space:nowrap}
.icon-btn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;font-weight:700}
.icon-btn:active{background:var(--soft)}
.top .icon-btn.gear{width:44px;height:44px;border-radius:14px;background:var(--card);border:var(--bw) solid var(--line);box-shadow:3px 3px 0 var(--sh)}
.gear svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}

/* hero */
.hero{margin:16px 0 0;display:flex;flex-direction:column;gap:14px}
.bank{background:var(--orange);color:var(--on-orange);border:var(--bw) solid #111;border-radius:26px;box-shadow:6px 6px 0 var(--sh);padding:18px 18px 16px}
.bank-top{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;font-weight:600}
.pill{background:#111;color:var(--yellow);border-radius:999px;padding:4px 11px;font-size:.78rem;font-weight:700}
.big{font-family:var(--disp);font-size:clamp(3.6rem,19vw,4.9rem);font-weight:800;line-height:1;letter-spacing:-.01em;margin:8px 0 12px;display:flex;align-items:baseline;gap:8px}
.big .cur{font-family:"Readex Pro",sans-serif;font-size:1.2rem;font-weight:700}
.big.neg{color:#111}
.strip{display:flex;height:22px;border:var(--bw) solid #111;border-radius:999px;overflow:hidden;background:#fff}
.strip span{height:100%;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.strip .s-fixed{background:var(--yellow);border-left:var(--bw) solid #111}
.strip .s-spend{background:var(--blue);border-left:var(--bw) solid #111}
.strip .s-left{background:#fff}
.strip span[style*="width:0%"]{border:0}
.bank-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:.84rem;font-weight:600}
.bank-foot button{background:#fff;color:#111;border:2px solid #111;border-radius:999px;padding:5px 14px;font-size:.8rem;font-weight:700;box-shadow:2px 2px 0 #111}

.bento{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.b{border:var(--bw) solid #111;border-radius:var(--r);box-shadow:4px 4px 0 var(--sh);padding:14px;display:flex;flex-direction:column;gap:2px;text-align:start;font-size:.84rem;font-weight:700;transition:transform .1s,box-shadow .1s}
.b:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.b b{font-family:var(--disp);font-size:2.1rem;font-weight:800;line-height:1.15;margin-top:4px;text-align:right}
.b small{font-size:.76rem;font-weight:600}
.b-fixed{background:var(--yellow);color:#111}
.b-spend{background:var(--blue);color:var(--on-blue)}

.cmp{display:flex;align-items:center;gap:12px;width:100%;text-align:start;background:var(--card);border:var(--bw) solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--sh);padding:12px 14px;transform:rotate(-1.2deg)}
.cmp-ic{width:40px;height:40px;border-radius:12px;border:var(--bw) solid var(--line);display:grid;place-items:center;flex:none}
.cmp.down .cmp-ic{background:var(--mint)} .cmp.up .cmp-ic{background:var(--pinky)}
.cmp-t{flex:1;font-size:.9rem;font-weight:600;line-height:1.35}
.cmp-t small{display:block;font-size:.74rem;color:var(--mute);font-weight:500}
.cmp b{font-family:var(--disp);font-size:1.5rem;font-weight:800}
.cmp.down b{color:var(--green)} .cmp.up b{color:var(--red)}

/* 7 days */
.wk{background:var(--card);border:var(--bw) solid var(--line);border-radius:22px;box-shadow:4px 4px 0 var(--sh);padding:14px 14px 10px}
.wk-h{display:flex;justify-content:space-between;align-items:baseline}
.wk-h small{font-size:.78rem;color:var(--mute);font-weight:600}
.wk-bars{display:flex;align-items:flex-end;gap:8px;height:150px;margin-top:8px}
.wk-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px;height:100%;padding:0}
.wk-col i{display:block;width:100%;background:var(--ink);border:var(--bw) solid var(--line);border-radius:10px 10px 4px 4px}
.wk-col i.today{background:var(--orange)}
.wk-v{font-size:.62rem;font-weight:700;color:var(--mute);min-height:12px}
.wk-d{font-size:.78rem;font-weight:700}

/* sections */
section{margin-top:24px}
h2{font-family:var(--disp);font-size:1.35rem;font-weight:800;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;line-height:1.2}
h2 .h-t{flex:1}
h2 small{font-family:"Readex Pro",sans-serif;font-weight:500;color:var(--mute);font-size:.8rem}
.panel{background:var(--card);border:var(--bw) solid var(--line);border-radius:var(--r);box-shadow:4px 4px 0 var(--sh);overflow:hidden}
.cat-row{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:12px 14px}
.cat-row+.cat-row{border-top:2px solid var(--line)}
.cat-emo{width:42px;height:42px;border-radius:13px;background:var(--soft);border:2px solid var(--line);display:grid;place-items:center;font-size:1.15rem}
.bar{height:10px;border-radius:9px;background:var(--soft);border:2px solid var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.cat-row b,.exp .a,.fx-amt{font-weight:700;white-space:nowrap}
.day-h{font-size:.78rem;color:var(--ink);padding:8px 14px;background:var(--yellow);font-weight:700;border-bottom:2px solid var(--line)}
.exp{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:11px 14px;width:100%;text-align:start}
.exp+.exp{border-top:2px solid var(--line)}
.exp .t{font-weight:700;font-size:.95rem}
.exp .n{font-size:.76rem;color:var(--mute);line-height:1.4}
.empty{padding:28px 18px;text-align:center;color:var(--mute);font-size:.92rem}
.empty b{display:block;color:var(--ink);font-size:1.05rem;margin-bottom:4px}
.link{color:var(--blue);font-weight:700;padding:4px 2px;font-size:.86rem;text-decoration:underline;text-underline-offset:3px}
:root[data-theme="dark"] .link{color:var(--yellow)}

/* fixed charges */
.fx-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.fx-sum div{background:var(--card);border:var(--bw) solid var(--line);border-radius:16px;box-shadow:3px 3px 0 var(--sh);padding:10px 11px;font-size:.74rem;color:var(--mute);font-weight:600}
.fx-sum div:nth-child(2){background:var(--mint)}
.fx-sum b{display:block;font-family:var(--disp);font-size:1.25rem;color:var(--ink);white-space:nowrap;margin-top:2px}
.fx{display:grid;grid-template-columns:auto 1fr auto auto;gap:12px;align-items:center;padding:12px 14px}
.fx+.fx{border-top:2px solid var(--line)}
.check{width:34px;height:34px;border-radius:11px;border:var(--bw) solid var(--line);display:grid;place-items:center;font-size:1rem;font-weight:800;color:transparent;background:var(--card)}
.fx.paid .check{background:var(--yellow);color:#111}
.fx.paid .fx-name{text-decoration:line-through;color:var(--mute)}
.fx-name{font-weight:700}
.fx-day{font-size:.76rem;color:var(--mute)}
.fx-del{color:var(--ink);font-size:1.1rem;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card)}
.progress{height:18px;border-radius:999px;background:var(--card);border:var(--bw) solid var(--line);overflow:hidden;margin-bottom:14px}
.progress i{display:block;height:100%;background:var(--yellow);border-left:var(--bw) solid var(--line)}

/* settings */
.set-row{display:flex;justify-content:space-between;align-items:center;padding:14px;gap:12px}
.set-row+.set-row{border-top:2px solid var(--line)}
.set-row .d{font-size:.76rem;color:var(--mute)}
.seg{display:flex;background:var(--card);border:var(--bw) solid var(--line);border-radius:999px;padding:3px}
.seg button{padding:6px 12px;border-radius:999px;font-size:.86rem;font-weight:700;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.btn{display:block;width:100%;padding:15px;border-radius:18px;font-weight:700;font-size:1rem;text-align:center;border:var(--bw) solid var(--line);box-shadow:4px 4px 0 var(--sh);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.btn-main{background:var(--blue);color:#fff;border-color:#111}
.btn-ghost{background:var(--card)}
.btn-danger{color:var(--red);background:transparent;border:0;box-shadow:none}
.sync{font-size:.78rem;color:var(--mute);padding:10px 4px}

/* nav */
.nav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:14px;right:14px;z-index:20;max-width:492px;margin:0 auto;background:var(--card);border:var(--bw) solid var(--line);border-radius:24px;box-shadow:4px 4px 0 var(--sh);padding:7px}
.nav-in{display:flex;align-items:center;gap:4px}
.tab{flex:1;padding:6px 2px;border-radius:14px;font-size:.7rem;font-weight:600;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:2px;border:2px solid transparent}
.tab svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{background:var(--yellow);color:#111;border-color:#111;font-weight:800}
.fab{width:60px;height:54px;border-radius:18px;background:var(--blue);color:#fff;font-size:2rem;font-weight:500;display:grid;place-items:center;flex:none;border:var(--bw) solid #111;box-shadow:3px 3px 0 var(--sh);line-height:1;transition:transform .1s,box-shadow .1s}
.fab:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--sh)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;max-width:520px;margin:0 auto;background:var(--bg);border:var(--bw) solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.2,.8,.2,1),visibility 0s .32s;max-height:92%;overflow-y:auto}
.sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.grab{width:46px;height:6px;border-radius:9px;background:var(--ink);margin:0 auto 14px}
.sheet h3{font-family:var(--disp);margin:0 0 12px;font-size:1.6rem;font-weight:800;line-height:1.2}
.amount-in{display:flex;align-items:baseline;gap:8px;background:var(--card);border:var(--bw) solid var(--line);border-radius:20px;box-shadow:4px 4px 0 var(--sh);padding:8px 16px;margin-bottom:16px;direction:ltr}
.amount-in input{flex:1;min-width:0;border:0;background:transparent;font-family:var(--disp);font-size:2.8rem;font-weight:800;outline:none;text-align:right;line-height:1.2}
.amount-in span{color:var(--mute);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:7px 12px;border-radius:999px;background:var(--card);font-size:.86rem;font-weight:600;border:2px solid var(--line)}
.chip[aria-pressed="true"]{background:var(--yellow);color:#111;box-shadow:2px 2px 0 var(--sh);font-weight:800}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:.82rem;color:var(--mute);margin-bottom:5px;font-weight:600}
.field input{width:100%;padding:12px 14px;border-radius:14px;border:var(--bw) solid var(--line);background:var(--card);outline:none}
.field input:focus{box-shadow:3px 3px 0 var(--blue)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sheet .actions{display:flex;flex-direction:column;gap:10px;margin-top:6px}

/* onboarding */
.onb{padding-top:5vh}
.onb .bank{margin-top:22px;padding:26px 22px}
.onb .big{font-size:clamp(2.4rem,11vw,3.2rem);margin:0;line-height:1.15;display:block}
.onb p{color:var(--mute);max-width:36ch}

/* calendar */
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;font-size:.78rem;color:var(--ink);text-align:center;margin-bottom:6px;font-weight:800}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{position:relative;aspect-ratio:1/1.2;border-radius:13px;background:var(--card);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--disp);font-size:1.05rem;font-weight:800;padding:0;line-height:1.1}
.day small{font-family:"Readex Pro",sans-serif;font-size:.6rem;font-weight:700;color:var(--mute)}
.day.heat1{background:#FFE1D6} .day.heat2{background:#FFB59C} .day.heat3{background:var(--orange);color:#fff}
.day.heat3 small{color:#fff}
:root[data-theme="dark"] .day.heat1{background:#4A2A1F} :root[data-theme="dark"] .day.heat2{background:#7A3A22}
.day.has small{color:inherit}
.day.today{box-shadow:3px 3px 0 var(--sh)}
.day.future{opacity:.45}
.day.sel{background:var(--blue);color:#fff;box-shadow:3px 3px 0 var(--sh);opacity:1}
.day.sel small{color:#fff}
.day .mo{position:absolute;top:2px;font-family:"Readex Pro",sans-serif;font-size:.5rem;font-weight:700;white-space:nowrap}
.day-card{margin-top:20px}
.day-title{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:10px}
.day-title b{font-family:var(--disp);font-size:1.5rem;font-weight:800}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}
.quick .chip{white-space:nowrap;flex:none}

/* dashboard */
.dash-seg{margin:14px 0 12px;width:100%}
.dash-seg button{flex:1;padding:9px 6px}
.dash-total{padding:16px 16px 8px}
.dash-total .big{color:var(--ink)!important;font-size:3.2rem}
.split{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.78rem;color:var(--mute);font-weight:600}
.split b{display:block;color:var(--ink);font-size:1rem;white-space:nowrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;border:1.5px solid var(--line);margin-inline-end:5px}
.chart{display:flex;align-items:stretch;gap:5px;height:180px;margin-top:14px;padding-top:6px;border-top:2px solid var(--line)}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:6px 0 4px;border-radius:12px;min-width:0}
.col .v{font-size:.58rem;color:var(--mute);font-weight:700;height:12px}
.col .stack{width:74%;max-width:28px;display:flex;flex-direction:column;border:2px solid var(--line);border-radius:7px;overflow:hidden;background:var(--soft)}
.col .stack i{display:block;width:100%}
.col small{font-size:.58rem;color:var(--mute);white-space:nowrap;overflow:hidden;max-width:100%;font-weight:700}
.col.sel{background:var(--soft);outline:2px solid var(--line)}
.col.sel small{color:var(--ink)}
.ins{display:grid;grid-template-columns:42px 1fr;gap:12px;align-items:center;padding:12px 14px}
.ins+.ins{border-top:2px solid var(--line)}
.ins p{margin:0;font-size:.9rem;line-height:1.6}
.ins b{font-weight:800}

.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--yellow);color:#111;border:var(--bw) solid #111;box-shadow:3px 3px 0 #111;padding:9px 18px;border-radius:999px;font-size:.9rem;font-weight:800;opacity:0;pointer-events:none;transition:all .25s;z-index:60;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
/* v3 additions */
.top-r{display:flex;align-items:center;gap:8px}
.icon-btn.sq{width:44px;height:44px;border-radius:14px;background:var(--card);border:var(--bw) solid var(--line);box-shadow:3px 3px 0 var(--sh);font-size:1.3rem}
.icon-btn.sq svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
.month{margin-top:12px;justify-content:space-between}
.month h1{flex:1;font-size:.95rem!important}
.muted-s{font-size:.8rem;color:var(--mute);font-weight:600}
.card{background:var(--card);border:var(--bw) solid var(--line);border-radius:22px;box-shadow:4px 4px 0 var(--sh);padding:14px}
section.card{margin-top:22px}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:.76rem;font-weight:700;color:var(--mute)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:4px;border:2px solid var(--line);display:inline-block}
.legend i.dash{height:4px;border:0;border-radius:2px}

/* wallets */
.wals{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.wal{border:var(--bw) solid #111;border-radius:22px;box-shadow:4px 4px 0 var(--sh);padding:12px 14px 14px;display:flex;flex-direction:column;gap:2px;text-align:start;transition:transform .1s,box-shadow .1s}
.wal:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--sh)}
.wal-h{display:flex;align-items:center;gap:8px;font-size:.84rem;font-weight:800}
.wal-av{width:28px;height:28px;border-radius:50%;background:#fff;border:2px solid #111;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:1rem;line-height:1}
.wal-l{font-size:.74rem;font-weight:700;margin-top:6px;opacity:.9}
.wal b{font-family:var(--disp);font-size:2.3rem;font-weight:800;line-height:1.05;text-align:right}
.wal b.neg{text-decoration:underline wavy;text-underline-offset:6px}
.wal-bar{display:block;height:14px;border:2px solid #111;border-radius:999px;background:rgba(0,0,0,.28);overflow:hidden;margin:6px 0 4px}
.wal-bar i{display:block;height:100%;background:#fff;border-left:2px solid #111}
.wal small{font-size:.72rem;font-weight:600;opacity:.95}
.wal-in{box-shadow:4px 4px 0 #111}
.wal-in b{font-size:3rem}
.wal.wide{grid-column:1/-1}
.wal-tag{margin-inline-start:auto;background:#fff;color:#111;border:2px solid #111;border-radius:999px;padding:1px 10px;font-size:.72rem}
.wal-row{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin:4px 0}
.wal-row .wal-l{display:block}
.wal-today{background:#fff;color:#111;border:2px solid #111;border-radius:14px;padding:6px 12px;text-align:center;box-shadow:2px 2px 0 #111}
.wal-today small{display:block;font-size:.68rem;font-weight:700}
.wal-today b{font-size:1.5rem!important}
.wchip{display:inline-block;padding:2px 10px;border-radius:999px;border:2px solid #111;font-size:.78rem;font-weight:800}

.fixc{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;width:100%;text-align:start;background:var(--yellow);color:#111;border:var(--bw) solid #111;border-radius:20px;box-shadow:4px 4px 0 var(--sh);padding:12px 14px}
.fixc-t{font-size:.9rem;font-weight:800}
.fixc-t small{display:block;font-size:.74rem;font-weight:600}
.fixc b{font-family:var(--disp);font-size:1.9rem;font-weight:800}
.fixc-bar{grid-column:1/-1;display:block;height:12px;border:2px solid #111;border-radius:999px;background:#fff;overflow:hidden}
.fixc-bar i{display:block;height:100%;background:#111}

/* week stacked */
.wk-stack{display:flex;flex-direction:column-reverse;width:100%;border:var(--bw) solid var(--line);border-radius:10px 10px 4px 4px;overflow:hidden;background:var(--soft)}
.wk-stack i{display:block;width:100%;min-height:3px}
.wk-col.today .wk-stack{box-shadow:0 0 0 3px var(--orange)}
.wk-col.today .wk-d{color:var(--orange)}

/* rows */
.exp{grid-template-columns:14px 1fr auto!important}
.exp-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line)}
.day-split{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:10px;font-size:.84rem;font-weight:700}
.day-split span{display:flex;align-items:center;gap:6px}
.day-title b{font-family:var(--disp)}

/* dashboard */
.dt-row{display:flex;align-items:center;gap:14px;margin-top:8px}
.dt-donut{position:relative;width:150px;height:150px;flex:none}
.donut{width:150px;height:150px;display:block}
.dt-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.dt-c b{font-family:var(--disp);font-size:1.7rem;font-weight:800}
.dt-c small{font-size:.7rem;font-weight:700;color:var(--mute)}
.dt-leg{flex:1;display:flex;flex-direction:column;gap:10px;min-width:0}
.dt-leg div{display:grid;grid-template-columns:14px 1fr auto;gap:8px;align-items:center}
.dt-leg i{width:14px;height:14px;border-radius:4px;border:2px solid var(--line)}
.dt-leg span{font-size:.76rem;font-weight:600;color:var(--mute);line-height:1.3}
.dt-leg span b{display:block;color:var(--ink);font-size:.92rem;font-weight:800;white-space:nowrap}
.dt-leg em{font-style:normal;font-family:var(--disp);font-weight:800;font-size:1.05rem}
.bud{display:block;width:100%;text-align:start;padding:8px 0}
.bud+.bud{border-top:2px dashed var(--soft)}
.bud-h{display:flex;justify-content:space-between;align-items:center;font-size:.86rem;font-weight:700;margin-bottom:6px}
.bud-h .over{color:var(--red)}
.bud-bar{display:block;height:18px;border:var(--bw) solid var(--line);border-radius:999px;background:var(--soft);overflow:hidden}
.bud-bar i{display:block;height:100%;border-left:var(--bw) solid var(--line)}
.lc{width:100%;height:auto;display:block;margin-top:4px}
.chart{display:flex;align-items:flex-end;gap:5px;height:175px;margin-top:6px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;padding:6px 0 4px;border-radius:12px;min-width:0;height:100%}
.col .stack{width:74%;max-width:30px;display:flex;flex-direction:column-reverse;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--soft)}
.col .stack i{display:block;width:100%;min-height:2px}
.ins-e{width:40px;height:40px;border-radius:12px;background:var(--soft);border:2px solid var(--line);display:grid;place-items:center;font-size:1.1rem}
.hb{padding:8px 0}
.hb+.hb{border-top:2px dashed var(--soft)}
.hb-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.9rem}
.hb-h small{color:var(--mute);font-weight:700}
.hb-bar{height:14px;border:2px solid var(--line);border-radius:999px;background:var(--soft);overflow:hidden;margin-top:5px}
.hb-bar i{display:block;height:100%;border-left:2px solid var(--line)}

/* wallet selector */
.wseg{display:flex;gap:8px;margin-bottom:14px}
.wseg button{flex:1;padding:10px 8px;border-radius:14px;border:var(--bw) solid var(--line);background:var(--card);font-weight:800;font-size:.95rem;color:var(--ink)}
.wseg button[aria-pressed="true"]{background:var(--wc);color:var(--wf);box-shadow:3px 3px 0 var(--sh)}

/* calculator */
.calc{margin-top:4px}
.calc-disp{display:flex;align-items:center;gap:10px;background:var(--card);border:var(--bw) solid var(--line);border-radius:18px;box-shadow:4px 4px 0 var(--sh);padding:8px 12px;margin-bottom:12px}
.calc-c{width:44px;height:44px;border-radius:12px;background:var(--pinky);border:2px solid var(--line);font-weight:800;font-size:1.05rem;flex:none}
.calc-v{flex:1;text-align:left;direction:ltr;min-width:0}
.calc-expr{font-size:.9rem;color:var(--mute);font-weight:700;min-height:1.1em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.calc-res{font-family:var(--disp);font-size:2.4rem;font-weight:800;line-height:1.1;white-space:nowrap}
.calc-res small{font-family:"Readex Pro",sans-serif;font-size:.9rem;color:var(--mute)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;direction:ltr}
.key{height:52px;border-radius:14px;background:var(--card);border:2px solid var(--line);box-shadow:2px 2px 0 var(--sh);font-family:var(--disp);font-size:1.45rem;font-weight:800;transition:transform .06s,box-shadow .06s}
.key:active{transform:translate(2px,2px);box-shadow:0 0 0 var(--sh)}
.key.op{background:var(--yellow);color:#111}
.save-row{display:flex;gap:10px;margin-top:14px;align-items:stretch}
.save-row input{flex:0 0 42%;padding:10px;border-radius:14px;border:var(--bw) solid var(--line);background:var(--card);font-weight:700}
.save-row .btn{flex:1}
.sheet .quick{margin:-4px 0 12px}

[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>

<nav class="nav" id="nav" hidden>
  <div class="nav-in" role="tablist">
    <button class="tab" role="tab" data-tab="month" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>الشهر</button>
    <button class="tab" role="tab" data-tab="cal" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/><circle cx="8" cy="14" r=".6"/><circle cx="12" cy="14" r=".6"/><circle cx="16" cy="14" r=".6"/></svg>كل نهار</button>
    <button class="fab" id="fab" aria-label="زيد مصروف"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="tab" role="tab" data-tab="dash" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>الداشبورد</button>
    <button class="tab" role="tab" data-tab="fixed" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>الشارجات</button>
  </div>
</nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
const KEY='massrouf-v1';
const MONTHS=['يناير','فبراير','مارس','أبريل','ماي','يونيو','يوليوز','غشت','شتنبر','أكتوبر','نونبر','دجنبر'];
const WD=['الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة','السبت'];
const WD_SHORT=['إ','ث','ر','خ','ج','س','ح']; // Monday → Sunday
const WDS=['ح','ن','ث','ر','خ','ج','س'];      // by getDay()
const CUR={DH:'درهم','€':'€','$':'$'};
const PAL=[{bg:'#2F5BFF',fg:'#FFFFFF'},{bg:'#FF7AA8',fg:'#111111'},{bg:'#18B36B',fg:'#FFFFFF'},{bg:'#8B5CF6',fg:'#FFFFFF'}];
const FIXED_C='#FFC93C';
const LEGACY={hanout:'حانوت',food:'بيم / مرجان',out:'قهوة و خرجات',trans:'ترانسبور',subs:'اشتراكات',phone:'تيليفون',home:'دار',health:'صحة',clothes:'حوايج',family:'العائلة',gift:'هدايا',other:'مصروف'};

/* ---------- state ---------- */
const defWallets=()=>[{id:'dar',name:'الدار',budget:0,c:2},{id:'ayoub',name:'أيوب',budget:1000,c:0},{id:'hafsa',name:'حفصة',budget:1000,c:1}];
function blank(){return {v:4,updatedAt:0,settings:{income:0,currency:'DH',setup:false,startDay:25,theme:'light',sv:2,wallets:defWallets(),lastW:'dar'},fixed:[],months:{},exp:[]}}
function migrate(s){
  if(!s||![1,2,3,4].includes(s.v)) return null;
  if(!Array.isArray(s.exp)) s.exp=[];
  Object.values(s.months||{}).forEach(m=>{ if(Array.isArray(m.exp)){ s.exp.push(...m.exp); delete m.exp; } if(!m.paid) m.paid={}; });
  s.settings=s.settings||{};
  if(!s.settings.startDay) s.settings.startDay=25;
  if(!s.settings.sv){ s.settings.theme='light'; s.settings.sv=2; }
  if(!Array.isArray(s.settings.wallets)||!s.settings.wallets.length) s.settings.wallets=defWallets();
  if(!s.settings.wallets.some(w=>w.id==='dar')) s.settings.wallets.unshift({id:'dar',name:'الدار',budget:0,c:2});
  const w0=s.settings.wallets[0].id;
  if(!s.settings.lastW) s.settings.lastW=w0;
  s.exp.forEach(x=>{ if(!x.w) x.w=w0; if(!x.note&&x.cat) x.note=LEGACY[x.cat]||'مصروف'; delete x.cat; });
  s.months=s.months||{}; s.fixed=s.fixed||[]; if(s.v<4) s.settings.lastW='dar'; s.v=4;
  return s;
}
let state=blank();
try{const raw=localStorage.getItem(KEY); if(raw){const s=migrate(JSON.parse(raw)); if(s) state=s;}}catch(e){}

const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mk=(y,m)=>y+'-'+pad(m+1);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const today=()=>{const d=new Date(); d.setHours(12,0,0,0); return d;};
const sd=()=>Math.min(28,Math.max(1,state.settings.startDay||1));
const W=()=>state.settings.wallets;
const wOf=id=>W().find(w=>w.id===id)||W()[0];
const wc=w=>PAL[(w&&w.c||0)%PAL.length];

function periodOf(d){ let y=d.getFullYear(), m=d.getMonth(); if(d.getDate()<sd()){ m--; if(m<0){m=11;y--;} } return {y,m}; }
function range(p){ const s=new Date(p.y,p.m,sd(),12), e=new Date(p.y,p.m+1,sd(),12); return {s,e,si:iso(s),ei:iso(e)}; }
function days(p){ const r=range(p), out=[]; for(let d=new Date(r.s); d<r.e; d.setDate(d.getDate()+1)) out.push(new Date(d)); return out; }
function shift(p,n){ let m=p.m+n, y=p.y; y+=Math.floor(m/12); m=((m%12)+12)%12; return {y,m}; }
let cur=periodOf(today());
let tab='month', selDate=iso(today()), dRange='month';
const isCurrent=()=>{const p=periodOf(today()); return p.y===cur.y&&p.m===cur.m;};
const sameP=(a,b)=>a.y===b.y&&a.m===b.m;
function periodData(k){ if(!state.months[k]) state.months[k]={income:null,paid:{}}; if(!state.months[k].paid) state.months[k].paid={}; return state.months[k]; }
function periodExp(p){ const r=range(p); return state.exp.filter(x=>x.date>=r.si&&x.date<r.ei); }
function stats(p){ const md=periodData(mk(p.y,p.m)), ex=periodExp(p); const byW={}; W().forEach(w=>byW[w.id]=0); ex.forEach(x=>byW[x.w]=(byW[x.w]||0)+x.amt);
  const spent=ex.reduce((a,x)=>a+x.amt,0); const fixedPaid=state.fixed.filter(f=>md.paid[f.id]).reduce((a,f)=>a+f.amount,0);
  return {p,ex,spent,fixedPaid,byW,total:spent+fixedPaid}; }
function totals(){ const st=stats(cur), md=periodData(mk(cur.y,cur.m));
  const income= md.income!=null ? md.income : state.settings.income;
  const fixedTotal=state.fixed.reduce((a,f)=>a+f.amount,0);
  return {...st,income,fixedTotal,md,left:income-fixedTotal-st.spent}; }
function fitSel(){ const r=range(cur); if(!(selDate>=r.si&&selDate<r.ei)) selDate= isCurrent()? iso(today()) : r.si; }
const daysLeft=()=>Math.max(1,Math.round((range(cur).e-today())/864e5));

/* ---------- persistence: phone + claude account ---------- */
let db=null, docPath=null, saving=false, again=false, timer=null, syncMode='local';
function persist(){
  state.updatedAt=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  if(db){clearTimeout(timer); timer=setTimeout(pushRemote,600);}
}
async function pushRemote(){
  if(!db) return;
  if(saving){again=true;return;}
  saving=true;
  try{ await db.doc(docPath).set({updatedAt:state.updatedAt, body:JSON.stringify(state)}); syncMode='cloud'; }
  catch(e){ if(e&&(e.code==='invalid_argument'||e.code==='revoked'||e.code==='not_granted')){db=null;} syncMode='local'; }
  saving=false;
  if(again){again=false;pushRemote();}
  if(tab==='settings') render();
}
(async function connect(){
  if(!window.claude||!window.claude.use) return;
  try{
    const [d,u]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; docPath='data/users/'+id+'/state';
    const snap=await db.doc(docPath).get();
    if(snap.exists){
      const r=snap.data();
      if((r.updatedAt||0)>(state.updatedAt||0)){
        try{const s=migrate(JSON.parse(r.body)); if(s){state=s; try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}}catch(e){}
        syncMode='cloud'; cur=periodOf(today()); render();
      } else if(state.updatedAt>(r.updatedAt||0)) pushRemote(); else {syncMode='cloud'; render();}
    } else if(state.updatedAt) pushRemote(); else {syncMode='cloud';}
  }catch(e){ db=null; }
})();

/* ---------- helpers ---------- */
const nf=new Intl.NumberFormat('fr-FR',{maximumFractionDigits:2});
const cu=()=>CUR[state.settings.currency];
function money(v){ return '<span class="num">'+nf.format(Math.round(v*100)/100)+'</span> '+cu(); }
const n0=v=>'<span class="num">'+nf.format(Math.round(v))+'</span>';
const compact=v=> v>=1000 ? (Math.round(v/100)/10).toString().replace('.',',')+'k' : String(Math.round(v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){const el=document.getElementById('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),1800);}
const dLabel=s=>{const d=new Date(s+'T12:00'); return d.getDate()+' '+MONTHS[d.getMonth()];};
function periodLabel(p){ if(sd()===1) return MONTHS[p.m]+' <span class="num">'+p.y+'</span>'; const r=range(p), e=new Date(r.e); e.setDate(e.getDate()-1); return '<span class="num">'+r.s.getDate()+'</span> '+MONTHS[r.s.getMonth()]+' – <span class="num">'+e.getDate()+'</span> '+MONTHS[e.getMonth()]; }
function shortLabel(p){ return MONTHS[sd()>15?(p.m+1)%12:p.m]; }
const wChip=w=>`<span class="wchip" style="background:${wc(w).bg};color:${wc(w).fg}">${esc(w.name)}</span>`;
const ICON={
  gear:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>',
  calc:'<svg viewBox="0 0 24 24"><rect x="5" y="2.5" width="14" height="19" rx="3"/><rect x="8" y="5.5" width="8" height="4" rx="1"/><path d="M8.5 13h.01M12 13h.01M15.5 13h.01M8.5 16.5h.01M12 16.5h.01M15.5 16.5h.01"/></svg>',
  up:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7M9 7h8v8"/></svg>',
  down:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7l10 10M17 9v8H9"/></svg>'
};

/* ---------- calculator ---------- */
function evalExpr(e){ if(!e) return NaN; let s=e.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/[*/+\-.]+$/,''); if(!s||!/^[0-9+\-*/.]+$/.test(s)) return NaN; try{ const v=Function('"use strict";return ('+s+')')(); return isFinite(v)?v:NaN; }catch(x){return NaN;} }
const OPS='÷×−+';
function calcHtml(){ return `<div class="calc"><div class="calc-disp"><button class="calc-c" data-k="C" aria-label="مسح">C</button><div class="calc-v"><div class="calc-expr num"></div><div class="calc-res"><span class="num">0</span> <small>${cu()}</small></div></div></div>
  <div class="keys">${['7','8','9','÷','4','5','6','×','1','2','3','−','.','0','⌫','+'].map(k=>`<button class="key ${OPS.includes(k)?'op':''}" data-k="${k}" aria-label="${k==='⌫'?'مسح رقم':k}">${k}</button>`).join('')}</div></div>`; }
function bindCalc(root,init){ let e=init||''; const ex=root.querySelector('.calc-expr'), rs=root.querySelector('.calc-res .num');
  const upd=()=>{ ex.textContent=/[÷×−+]/.test(e.slice(1))?e:''; const v=evalExpr(e); rs.textContent= e ? (isFinite(v)? nf.format(Math.round(v*100)/100) : '…') : '0'; };
  root.addEventListener('click',ev=>{ const b=ev.target.closest('[data-k]'); if(!b) return; const k=b.dataset.k;
    if(k==='C') e=''; else if(k==='⌫') e=e.slice(0,-1);
    else if(OPS.includes(k)){ if(!e){ if(k==='−') e='−'; } else if(OPS.includes(e.slice(-1))) e=e.slice(0,-1)+k; else e+=k; }
    else if(k==='.'){ const last=e.split(/[÷×−+]/).pop(); if(!last.includes('.')) e+=(last===''?'0.':'.'); }
    else if(e.length<28) e+=k;
    if(navigator.vibrate) try{navigator.vibrate(8)}catch(x){}
    upd(); });
  upd(); return {val:()=>evalExpr(e)}; }

/* ---------- views ---------- */
const app=document.getElementById('app'), nav=document.getElementById('nav');

function topBar(withPeriod=true){
  return `<div class="top">
    <span class="brand">مصروفي</span>
    <div class="top-r">
      <button class="icon-btn sq" data-act="calc" aria-label="الحاسبة">${ICON.calc}</button>
      <button class="icon-btn sq" data-tab-go="settings" aria-label="الإعدادات">${ICON.gear}</button>
    </div>
  </div>
  ${withPeriod?`<div class="month">
    <button class="icon-btn" data-act="prev" aria-label="الشهر اللي فات">›</button>
    <h1>${periodLabel(cur)}</h1>
    <button class="icon-btn" data-act="next" aria-label="الشهر الجاي">‹</button>
  </div>`:''}`;
}

function viewOnboard(){
  nav.hidden=true;
  return `<div class="onb">
    <div class="brand">مصروفي</div>
    <div class="bank"><div class="big">شحال كتدخّل<br>ف الشهر؟</div></div>
    <p>كتب الخلصة و النهار اللي كتخلص فيه. مصروف الدار كتكتبو كل نهار، و أيوب و حفصة كل واحد عندو ميزانيتو.</p>

/* ---------- dashboard charts ---------- */
function donut(segs,total,label){
  const r=62, C=2*Math.PI*r; let acc=0;
  const arcs=segs.filter(s=>s.v>0).map(s=>{ const len=total? s.v/total*C:0; const el=`<circle cx="90" cy="90" r="${r}" fill="none" stroke="${s.c}" stroke-width="30" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 90 90)"/>`; acc+=len; return el; }).join('');
  return `<svg class="donut" viewBox="0 0 180 180" role="img" aria-label="${label}"><circle cx="90" cy="90" r="${r}" fill="none" stroke="var(--soft)" stroke-width="30"/>${arcs}<circle cx="90" cy="90" r="${r+15}" fill="none" stroke="var(--line)" stroke-width="2.5"/><circle cx="90" cy="90" r="${r-15}" fill="none" stroke="var(--line)" stroke-width="2.5"/></svg>`;
}
function lineChart(){
  const ds=days(cur), n=ds.length, tIso=iso(today()), Wd=340, H=190, pl=10, pr=10, pt=14, pb=24;
  const ex=periodExp(cur); const perDay={}; ex.forEach(x=>{ (perDay[x.date]=perDay[x.date]||{}); perDay[x.date][x.w]=(perDay[x.date][x.w]||0)+x.amt; });
  const series={}; W().forEach(w=>series[w.id]=[]); const tot=[]; const run={}; W().forEach(w=>run[w.id]=0); let rt=0;
  ds.forEach(d=>{ const k=iso(d); if(isCurrent()&&k>tIso) return; W().forEach(w=>{ run[w.id]+=(perDay[k]&&perDay[k][w.id])||0; series[w.id].push(run[w.id]); }); rt=W().reduce((a,w)=>a+run[w.id],0); tot.push(rt); });
  const prev=periodExp(shift(cur,-1)); const pr0=range(shift(cur,-1)); const pds=days(shift(cur,-1)); const prevTot=[]; let pr2=0; const pDay={}; prev.forEach(x=>pDay[x.date]=(pDay[x.date]||0)+x.amt); pds.forEach(d=>{ pr2+=pDay[iso(d)]||0; prevTot.push(pr2); });
  const budget=W().reduce((a,w)=>a+w.budget,0);
  const ymax=Math.max(1,budget,...tot,...prevTot)*1.08;
  const x=i=>Wd-pr-i*(Wd-pl-pr)/Math.max(1,n-1);
  const y=v=>pt+(H-pt-pb)*(1-v/ymax);
  const path=a=>a.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  const area=tot.length? path(tot)+` L${x(tot.length-1).toFixed(1)} ${y(0).toFixed(1)} L${x(0).toFixed(1)} ${y(0).toFixed(1)} Z`:'';
  const grid=[0,.5,1].map(f=>`<line x1="${pl}" x2="${Wd-pr}" y1="${y(ymax/1.08*f)}" y2="${y(ymax/1.08*f)}" stroke="var(--soft)" stroke-width="1.5"/>`).join('');
  const lbl=[0,Math.floor((n-1)/2),n-1].map(i=>`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--mute)">${ds[i].getDate()} ${MONTHS[ds[i].getMonth()].slice(0,4)}</text>`).join('');
  const last=tot.length-1;
  return `<svg viewBox="0 0 ${Wd} ${H}" class="lc" role="img" aria-label="الصرف نهار بنهار">${grid}
    ${budget?`<line x1="${pl}" x2="${Wd-pr}" y1="${y(budget)}" y2="${y(budget)}" stroke="var(--orange)" stroke-width="2.5" stroke-dasharray="7 5"/><text x="${Wd-pr}" y="${y(budget)-6}" text-anchor="end" direction="ltr" font-size="10" font-weight="800" fill="var(--orange)">الميزانية ${compact(budget)}</text>`:''}
    ${prevTot.length?`<path d="${path(prevTot.slice(0,n))}" fill="none" stroke="var(--mute)" stroke-width="2" stroke-dasharray="3 5" stroke-linecap="round"/>`:''}
    ${area?`<path d="${area}" fill="var(--ink)" opacity=".07"/>`:''}
    ${W().map(w=>series[w.id].length?`<path d="${path(series[w.id])}" fill="none" stroke="${wc(w).bg}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`:'').join('')}
    ${tot.length?`<path d="${path(tot)}" fill="none" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="${x(last)}" cy="${y(tot[last])}" r="6" fill="var(--orange)" stroke="var(--ink)" stroke-width="2.5"/>`:''}
    ${lbl}</svg>
    <div class="legend"><span><i style="background:var(--ink)"></i>المجموع</span>${W().map(w=>`<span><i style="background:${wc(w).bg}"></i>${esc(w.name)}</span>`).join('')}<span><i class="dash" style="background:var(--mute)"></i>الشهر اللي فات</span></div>`;
}

function insights(st){
  const out=[]; const ex=st.flatMap(x=>x.ex); if(!ex.length) return out;
  const t=totals();
  // budgets pace (current period)
  if(isCurrent()){ const r=range(cur), L=(r.e-r.s)/864e5, el=(today()-r.s)/864e5+1;
    W().forEach(w=>{ const s=t.byW[w.id]||0; if(!w.budget) return;
      if(s>w.budget) out.push({e:'🚨',t:`<b>${esc(w.name)}</b> فات الميزانية ب ${money(s-w.budget)}.`});
      else if(s>w.budget*el/L*1.15) out.push({e:'⚡',t:`<b>${esc(w.name)}</b> كيصرف أسرع من العادة: صرف ${money(s)} من ${n0(w.budget)} و باقي <b class="num">${daysLeft()}</b> يوم.`});
      else out.push({e:'✅',t:`<b>${esc(w.name)}</b> ماشي مزيان: باقي ليه ${money(w.budget-s)}، يعني تقريبا ${money((w.budget-s)/daysLeft())} ف النهار.`}); });
    W().filter(w=>!(w.budget>0)).forEach(w=>{ const s=t.byW[w.id]||0; if(s>0) out.push({e:'🏠',t:`<b>مصروف ${esc(w.name)}</b>: ${money(s)} ف <b class="num">${Math.round(el)}</b> يوم، يعني تقريبا ${money(s/el)} ف النهار.`}); });
    const save=t.income-t.fixedTotal-W().reduce((a,w)=>a+(w.budget||0),0)-W().filter(w=>!(w.budget>0)).reduce((a,w)=>a+(t.byW[w.id]||0)/el*L,0);
    if(t.income&&save>0) out.push({e:'💰',t:`إلا بقيتو هاكا، كيبقى ليكم تقريبا <b>${money(save)}</b> توفير ف آخر الشهر.`});
  }
  const items={}; ex.forEach(x=>{const k=(x.note||'').trim(); if(!k) return; (items[k]=items[k]||{n:0,v:0}); items[k].n++; items[k].v+=x.amt;});
  const rep=Object.entries(items).filter(([,v])=>v.n>=3).sort((a,b)=>b[1].v-a[1].v)[0];
  if(rep) out.push({e:'🔁',t:`شريتو <b>${esc(rep[0])}</b> <b class="num">${rep[1].n}</b> مرة = ${money(rep[1].v)}. إلا نقصتو النص، توفرو ${money(rep[1].v/2)}.`});
  const big=[...ex].sort((a,b)=>b.amt-a.amt)[0];
  if(big) out.push({e:'🏷️',t:`أكبر مصروف: <b>${esc(big.note)||'مصروف'}</b> — ${money(big.amt)} (${esc(wOf(big.w).name)}، ${dLabel(big.date)}).`});
  const wd=[0,0,0,0,0,0,0]; ex.forEach(x=>wd[new Date(x.date+'T12:00').getDay()]+=x.amt);
  const wi=wd.indexOf(Math.max(...wd)); if(wd[wi]>0) out.push({e:'📆',t:`أكثر نهار كتصرفو فيه هو <b>${WD[wi]}</b> (${money(wd[wi])}).`});
  return out;
}

/* ---------- sheets ---------- */
const sheet=document.getElementById('sheet'), scrim=document.getElementById('scrim');
function openSheet(html,focusSel){ sheet.innerHTML='<div class="grab"></div>'+html; sheet.classList.add('on'); scrim.classList.add('on'); sheet.scrollTop=0; if(focusSel) setTimeout(()=>{const f=sheet.querySelector(focusSel); f&&f.focus();},320); }
function closeSheet(){ sheet.classList.remove('on'); scrim.classList.remove('on'); }
scrim.onclick=closeSheet;
const parseNum=v=>{const n=parseFloat(String(v).replace(/\s/g,'').replace(',','.')); return isFinite(n)?n:NaN};
function defaultDate(){ if(tab==='cal') return selDate; if(isCurrent()) return iso(today()); return range(cur).si; }
function recentNotes(){ const seen=new Set(), out=[]; [...state.exp].sort((a,b)=>b.ts-a.ts).forEach(x=>{ const k=(x.note||'').trim(); if(k&&!seen.has(k)&&out.length<10){seen.add(k); out.push(x);} }); return out; }

function expenseSheet(x,preset){
  preset=preset||{};
  let selW= x? x.w : (preset.w||state.settings.lastW||W()[0].id);
  const rec=x?[]:recentNotes();
  openSheet(`<h3>${x?'بدّل المصروف':'شنو شريتي؟'}</h3>
    <div class="wseg" id="f-w">${W().map(w=>`<button data-w="${w.id}" aria-pressed="${w.id===selW}" style="--wc:${wc(w).bg};--wf:${wc(w).fg}">${esc(w.name)}</button>`).join('')}</div>
    <label class="field"><span>شنو شريتي</span><input id="f-note" type="text" placeholder="مثلا: حليب و دانون" value="${x?esc(x.note):''}" autocomplete="off"></label>
    ${rec.length?`<div class="quick">${rec.map(r=>`<button class="chip" data-q="${r.id}">${esc(r.note)} · <span class="num">${nf.format(r.amt)}</span></button>`).join('')}</div>`:''}
    <div id="f-calc">${calcHtml()}</div>
    <div class="save-row"><input id="f-date" type="date" value="${x?x.date:(preset.date||defaultDate())}" aria-label="النهار"><button class="btn btn-main" id="f-save">${x?'سجّل':'زيد'}</button></div>
    ${x?'<button class="btn btn-danger" id="f-del">حيد هاد المصروف</button>':''}`);
  let calc=bindCalc(sheet.querySelector('#f-calc'), x? String(x.amt) : (preset.amt? String(preset.amt):''));
  sheet.querySelector('#f-w').onclick=e=>{const b=e.target.closest('[data-w]'); if(!b) return; selW=b.dataset.w; sheet.querySelectorAll('#f-w button').forEach(c=>c.setAttribute('aria-pressed',c.dataset.w===selW));};
  const q=sheet.querySelector('.quick');
  if(q) q.onclick=e=>{const b=e.target.closest('[data-q]'); if(!b) return; const r=state.exp.find(v=>v.id===b.dataset.q); if(!r) return;
    sheet.querySelector('#f-note').value=r.note; const box=sheet.querySelector('#f-calc'); box.innerHTML=calcHtml(); calc=bindCalc(box,String(r.amt)); };
  sheet.querySelector('#f-save').onclick=()=>{
    const amt=calc.val();
    if(!(amt>0)){ toast('كتب المبلغ ف الحاسبة'); return; }
    const date=sheet.querySelector('#f-date').value||defaultDate();
    const note=sheet.querySelector('#f-note').value.trim();
    const a=Math.round(amt*100)/100;
    if(x){ Object.assign(x,{amt:a,note,date,w:selW}); }
    else state.exp.push({id:uid(),amt:a,note,date,w:selW,ts:Date.now()});
    state.settings.lastW=selW; selDate=date; cur=periodOf(new Date(date+'T12:00'));
    persist(); closeSheet(); render(); toast(x?'تبدّل ✓':'تزاد ✓ — '+wOf(selW).name);
  };
  const del=sheet.querySelector('#f-del');
  if(del) del.onclick=()=>{ state.exp=state.exp.filter(e=>e.id!==x.id); persist(); closeSheet(); render(); toast('تحيّد'); };
}

function calcSheet(){
  openSheet(`<h3>الحاسبة</h3><div id="c-calc">${calcHtml()}</div>
    <button class="btn btn-main" id="c-add" style="margin-top:14px">زيد النتيجة كمصروف</button>`);
  const calc=bindCalc(sheet.querySelector('#c-calc'),'');
  sheet.querySelector('#c-add').onclick=()=>{ const v=calc.val(); if(!(v>0)){toast('ما كاين حتى نتيجة');return;} closeSheet(); setTimeout(()=>expenseSheet(null,{amt:Math.round(v*100)/100}),250); };

    <div class="wal wal-in" style="background:${wc(w).bg};color:${wc(w).fg}">${w.budget>0?`<span class="wal-l">${w.budget-s<0?'فايت ب':'باقي'}</span><b class="num">${nf.format(Math.round(Math.abs(w.budget-s)))}</b><small>صرف ${n0(s)} من ${n0(w.budget)} · ${periodLabel(cur)}</small>`:`<span class="wal-l">صرفتو</span><b class="num">${nf.format(Math.round(s))}</b><small>${items.length} مصروف · ${periodLabel(cur)}</small>`}</div>

  const d=sheet.querySelector('#we-del');
  if(d) d.onclick=()=>{ const n=state.exp.filter(x=>x.w===w.id).length; if(!confirm(n?`عندو ${n} مصروف. غادي يدوزو ل ${W().find(v=>v.id!==w.id).name}. نكملو؟`:'نحيدو هاد الميزانية؟')) return;
    const to=W().find(v=>v.id!==w.id).id; state.exp.forEach(x=>{if(x.w===w.id) x.w=to;}); state.settings.wallets=W().filter(v=>v.id!==w.id); if(state.settings.lastW===w.id) state.settings.lastW=to; persist(); closeSheet(); render(); };

    <div class="actions"><button class="btn btn-main" id="x-save">${f?'سجّل التبديل':'زيد الشارج'}</button></div>`, f?null:'#x-name');

/* ---------- export ---------- */
async function exportCsv(){
  const t=totals(), r=range(cur);
  const q=s=>'"'+String(s).replace(/"/g,'""')+'"';
  const rows=[['النوع','التاريخ','شكون','الوصف','المبلغ','خلّصتي؟']];
  state.fixed.forEach(f=>rows.push(['شارج ثابت','نهار '+f.day,'',f.name,f.amount,t.md.paid[f.id]?'إيه':'لا']));
  [...t.ex].sort((a,b)=>a.date.localeCompare(b.date)||a.ts-b.ts).forEach(x=>rows.push(['مصروف',x.date,wOf(x.w).name,x.note,x.amt,'']));
  rows.push([]); W().forEach(w=>rows.push(['ميزانية '+w.name,'','','',w.budget,'صرف '+(t.byW[w.id]||0)]));
  rows.push(['الدخل','','','',t.income,''],['الباقي','','','',t.left,'']);
  const csv='\uFEFF'+rows.map(r=>r.map(q).join(',')).join('\r\n');
  const name='massrouf-'+r.si+'.csv';
  try{ const dl= window.claude&&window.claude.use ? await window.claude.use('downloads') : null; if(dl){ await dl.save({filename:name,data:csv}); return; } }catch(e){ if(e&&e.code==='declined') return; }
  try{ const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); const a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000); }catch(e){ toast('ما قدرناش نصدّرو'); }
}

/* ---------- events ---------- */
app.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.cur){ state.settings.currency=b.dataset.cur; if(state.settings.setup) persist(); render(); return; }
  if(b.dataset.themeSet){ state.settings.theme=b.dataset.themeSet; persist(); render(); return; }
  if(b.dataset.range){ dRange=b.dataset.range; render(); return; }
  if(b.dataset.period){ const [y,m]=b.dataset.period.split('-').map(Number); cur={y,m}; if(b.dataset.open){ tab='month'; window.scrollTo(0,0);} render(); return; }
  if(b.dataset.wallet){ const w=wOf(b.dataset.wallet); if(w) walletSheet(w); return; }
  if(b.dataset.wedit){ walletEdit(wOf(b.dataset.wedit)); return; }
  if(b.dataset.goDay){ selDate=b.dataset.goDay; tab='cal'; render(); window.scrollTo(0,0); return; }
  if(b.dataset.day){ selDate=b.dataset.day; render(); return; }
  if(b.dataset.exp){ const x=state.exp.find(v=>v.id===b.dataset.exp); if(x) expenseSheet(x); return; }
  if(b.dataset.pay){ const md=periodData(mk(cur.y,cur.m)); if(md.paid[b.dataset.pay]) delete md.paid[b.dataset.pay]; else md.paid[b.dataset.pay]=true; persist(); render(); return; }
  if(b.dataset.fx){ const f=state.fixed.find(v=>v.id===b.dataset.fx); if(f) fixedSheet(f); return; }
  if(b.dataset.fxdel){ const f=state.fixed.find(v=>v.id===b.dataset.fxdel); if(f&&confirm('نحيدو "'+f.name+'" من كل الشهور؟')){ state.fixed=state.fixed.filter(v=>v!==f); persist(); render(); } return; }
  if(b.dataset.tabGo){ tab=b.dataset.tabGo; render(); window.scrollTo(0,0); return; }
  switch(b.dataset.act){
    case 'prev': cur=shift(cur,-1); render(); break;
    case 'next': cur=shift(cur,1); render(); break;
    case 'calc': calcSheet(); break;
    case 'start':{ const v=parseNum(document.getElementById('onb-inc').value); if(!(v>0)){toast('كتب الدخل ديالك');return;}
      const d=parseInt(document.getElementById('onb-sd').value,10); if(d>=1&&d<=28) state.settings.startDay=d;
      state.settings.income=v; state.settings.setup=true; cur=periodOf(today()); persist(); render(); break; }
    case 'add-day': expenseSheet(null,{date:selDate}); break;
    case 'edit-income': incomeSheet(false); break;
    case 'edit-base-income': incomeSheet(true); break;
    case 'edit-sd': sdSheet(); break;
    case 'add-fixed': fixedSheet(null); break;
    case 'add-wallet': walletEdit(null); break;
    case 'export': exportCsv(); break;
    case 'reset': if(confirm('متأكد؟ غادي يتمسحو كاع المصاريف و الشارجات.')){ const s0=state.settings; state=blank(); state.settings.theme=s0.theme; state.settings.startDay=s0.startDay; state.settings.wallets=s0.wallets; persist(); tab='month'; render(); } break;
  }
});

  const t=e.target.closest('.tab'); if(t){ tab=t.dataset.tab; render(); window.scrollTo(0,0); return; }
  if(e.target.closest('#fab')) expenseSheet(null);
});
